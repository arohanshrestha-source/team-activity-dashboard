<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="api-base" content="http://127.0.0.1:5000" />
  <title>Team Activity Monitor</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f4f4f5;
    }
    .header {
      padding: 12px 20px;
      background: #18181b;
      color: #fff;
      font-weight: 600;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message {
      max-width: 85%;
      align-self: flex-start;
    }
    .message.user {
      align-self: flex-end;
    }
    .message-bubble {
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .message.user .message-bubble {
      background: #18181b;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .message.assistant .message-bubble {
      background: #fff;
      border: 1px solid #e4e4e7;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .message.assistant .message-bubble h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
    .message.assistant .message-bubble h2 { font-size: 1.1rem; margin: 0.75rem 0 0.25rem; }
    .message.assistant .message-bubble p { margin: 0.5rem 0; }
    .message.assistant .message-bubble ul { margin: 0.5rem 0; padding-left: 1.25rem; }
    .message.assistant .message-bubble a { color: #2563eb; text-decoration: none; }
    .message.assistant .message-bubble a:hover { text-decoration: underline; }
    .message-links {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #e4e4e7;
      font-size: 0.9rem;
    }
    .message-links a {
      color: #2563eb;
      text-decoration: none;
      margin-right: 12px;
    }
    .message-links a:hover { text-decoration: underline; }
    .message.thinking .message-bubble {
      color: #71717a;
      font-style: italic;
    }
    .input-row {
      flex-shrink: 0;
      padding: 16px 20px 24px;
      background: #fff;
      border-top: 1px solid #e4e4e7;
    }
    .input-wrap {
      display: flex;
      gap: 10px;
      max-width: 800px;
      margin: 0 auto;
    }
    .input-wrap input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #d4d4d8;
      border-radius: 12px;
      font-size: 1rem;
    }
    .input-wrap input:focus {
      outline: none;
      border-color: #18181b;
      box-shadow: 0 0 0 2px rgba(24,24,27,0.1);
    }
    .input-wrap button {
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      background: #18181b;
      color: #fff;
      font-weight: 500;
      cursor: pointer;
    }
    .input-wrap button:hover:not(:disabled) { background: #3f3f46; }
    .input-wrap button:disabled { opacity: 0.6; cursor: not-allowed; }
    .welcome {
      color: #71717a;
      text-align: center;
      padding: 24px 16px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <header class="header">Team Activity Monitor</header>

  <div id="chat" class="chat-container"></div>

  <div class="input-row">
    <div class="input-wrap">
      <input id="q" placeholder="Ask about team activity, JIRA issues, weather..." autocomplete="off" />
      <button id="askBtn">Send</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/script.js"></script>
</body>
</html>
